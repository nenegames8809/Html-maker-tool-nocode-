<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Editor 3D na Web</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react"
      }
    }
  </script>

  <style>
    body { margin: 0; background-color: #09090b; overflow: hidden; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #52525b; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    // Agora importamos de forma limpa, graças ao importmap
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Box, Circle, Cylinder, Sun, Download, Menu, X, Layers, 
      Move, RotateCw, Maximize, Plus, Trash2, Settings,
      Eye, Save, Image as ImageIcon, Check, Copy
    } from 'lucide-react';

    // --- CONFIGURAÇÃO E CARREGAMENTO DO THREE.JS ---
    const loadThreeJS = async () => {
      if (window.THREE && window.THREE.TransformControls) return window.THREE;

      const loadScript = (src) => new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });

      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');
      await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js');

      return window.THREE;
    };

    // --- ESTADOS PADRÃO ---
    const DEFAULT_MATERIAL = {
      color: '#4facfe',
      roughness: 0.5,
      metalness: 0.1,
      emissive: '#000000',
      emissiveIntensity: 0
    };

    function App() {
      const [isLoaded, setIsLoaded] = useState(false);
      
      const [sceneGraph, setSceneGraph] = useState({
        objects: [],
        lights: [
          { id: 'light_amb', type: 'ambient', color: '#ffffff', intensity: 0.4 },
          { id: 'light_dir', type: 'directional', color: '#ffffff', intensity: 0.8, position: [5, 10, 5] }
        ]
      });
      
      const [selectedId, setSelectedId] = useState(null);
      const [activeTool, setActiveTool] = useState('translate');
      const [isUIVisible, setIsUIVisible] = useState(true);
      
      const [showAddMenu, setShowAddMenu] = useState(false);
      const [showProperties, setShowProperties] = useState(false);
      const [showSceneTree, setShowSceneTree] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [isCopied, setIsCopied] = useState(false);

      const canvasContainerRef = useRef(null);
      const engineRef = useRef({});

      // --- INICIALIZAÇÃO DA ENGINE 3D ---
      useEffect(() => {
        let mounted = true;
        
        loadThreeJS().then((THREE) => {
          if (!mounted) return;
          setIsLoaded(true);

          const container = canvasContainerRef.current;
          if (!container) return;

          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(container.clientWidth, container.clientHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.outputEncoding = THREE.sRGBEncoding;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          container.appendChild(renderer.domElement);

          const scene = new THREE.Scene();
          scene.background = new THREE.Color('#1e1e24');

          const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
          scene.add(gridHelper);

          const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
          camera.position.set(5, 5, 5);

          const orbit = new THREE.OrbitControls(camera, renderer.domElement);
          orbit.enableDamping = true;
          orbit.dampingFactor = 0.05;

          const transformControl = new THREE.TransformControls(camera, renderer.domElement);
          transformControl.addEventListener('dragging-changed', (event) => {
            orbit.enabled = !event.value;
            if (!event.value && engineRef.current.selectedMesh) {
              const mesh = engineRef.current.selectedMesh;
              updateObjectStateFromMesh(mesh);
            }
          });
          scene.add(transformControl);

          const raycaster = new THREE.Raycaster();
          const mouse = new THREE.Vector2();

          let touchStartTime = 0;
          const onPointerDown = () => { touchStartTime = Date.now(); };

          const onPointerUp = (event) => {
            if (Date.now() - touchStartTime > 300) return;

            const rect = container.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(scene.children.filter(c => c.userData.isUserObject));

            if (intersects.length > 0) {
              const object = intersects[0].object;
              setSelectedId(object.userData.id);
            } else {
              if (!transformControl.dragging) {
                setSelectedId(null);
              }
            }
          };

          container.addEventListener('pointerdown', onPointerDown);
          container.addEventListener('pointerup', onPointerUp);

          const onWindowResize = () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
          };
          window.addEventListener('resize', onWindowResize);

          let animationFrameId;
          const animate = () => {
            animationFrameId = requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
          };
          animate();

          engineRef.current = { 
            THREE, renderer, scene, camera, orbit, transformControl, 
            meshes: {}, lights: {} 
          };

          return () => {
            mounted = false;
            cancelAnimationFrame(animationFrameId);
            window.removeEventListener('resize', onWindowResize);
            container.removeEventListener('pointerdown', onPointerDown);
            container.removeEventListener('pointerup', onPointerUp);
            if (container.contains(renderer.domElement)) {
              container.removeChild(renderer.domElement);
            }
            renderer.dispose();
          };
        });
      }, []);

      // --- ATUALIZAR ENGINE QUANDO O ESTADO REACT MUDA ---
      useEffect(() => {
        if (!isLoaded || !engineRef.current.scene) return;
        const { THREE, scene, meshes, lights: engineLights } = engineRef.current;

        const currentObjectIds = new Set(sceneGraph.objects.map(o => o.id));
        
        Object.keys(meshes).forEach(id => {
          if (!currentObjectIds.has(id)) {
            scene.remove(meshes[id]);
            meshes[id].geometry.dispose();
            meshes[id].material.dispose();
            delete meshes[id];
          }
        });

        sceneGraph.objects.forEach(obj => {
          let mesh = meshes[obj.id];
          
          if (!mesh) {
            let geometry;
            switch (obj.type) {
              case 'cube': geometry = new THREE.BoxGeometry(1, 1, 1); break;
              case 'sphere': geometry = new THREE.SphereGeometry(0.6, 32, 16); break;
              case 'cylinder': geometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 32); break;
              case 'cone': geometry = new THREE.ConeGeometry(0.5, 1, 32); break;
              case 'plane': geometry = new THREE.PlaneGeometry(2, 2); break;
              default: geometry = new THREE.BoxGeometry(1, 1, 1);
            }
            
            const material = new THREE.MeshStandardMaterial({
              color: obj.materialProps?.color || DEFAULT_MATERIAL.color,
              roughness: obj.materialProps?.roughness ?? DEFAULT_MATERIAL.roughness,
              metalness: obj.materialProps?.metalness ?? DEFAULT_MATERIAL.metalness,
              emissive: obj.materialProps?.emissive || DEFAULT_MATERIAL.emissive,
              side: obj.type === 'plane' ? THREE.DoubleSide : THREE.FrontSide
            });

            mesh = new THREE.Mesh(geometry, material);
            mesh.userData = { id: obj.id, isUserObject: true };
            scene.add(mesh);
            meshes[obj.id] = mesh;
          }

          if (engineRef.current.transformControl.object !== mesh || !engineRef.current.transformControl.dragging) {
            mesh.position.set(...obj.position);
            mesh.rotation.set(...obj.rotation);
            mesh.scale.set(...obj.scale);
            
            if (mesh.material) {
              mesh.material.color.set(obj.materialProps?.color || DEFAULT_MATERIAL.color);
              mesh.material.roughness = obj.materialProps?.roughness ?? DEFAULT_MATERIAL.roughness;
              mesh.material.metalness = obj.materialProps?.metalness ?? DEFAULT_MATERIAL.metalness;
              mesh.material.emissive.set(obj.materialProps?.emissive || DEFAULT_MATERIAL.emissive);
            }
          }
        });

        sceneGraph.lights.forEach(l => {
          let light = engineLights[l.id];
          if (!light) {
            if (l.type === 'ambient') light = new THREE.AmbientLight(l.color, l.intensity);
            if (l.type === 'directional') light = new THREE.DirectionalLight(l.color, l.intensity);
            scene.add(light);
            engineLights[l.id] = light;
          }
          light.color.set(l.color);
          light.intensity = l.intensity;
          if (l.position && light.position) {
            light.position.set(...l.position);
          }
        });

      }, [sceneGraph, isLoaded]);

      useEffect(() => {
        if (!isLoaded || !engineRef.current.transformControl) return;
        const { transformControl, meshes } = engineRef.current;

        if (selectedId && meshes[selectedId]) {
          const mesh = meshes[selectedId];
          transformControl.attach(mesh);
          engineRef.current.selectedMesh = mesh;
          setShowProperties(true);
        } else {
          transformControl.detach();
          engineRef.current.selectedMesh = null;
          setShowProperties(false);
        }
      }, [selectedId, isLoaded]);

      useEffect(() => {
        if (!isLoaded || !engineRef.current.transformControl) return;
        engineRef.current.transformControl.setMode(activeTool);
      }, [activeTool, isLoaded]);

      const updateObjectStateFromMesh = (mesh) => {
        setSceneGraph(prev => ({
          ...prev,
          objects: prev.objects.map(obj => {
            if (obj.id === mesh.userData.id) {
              return {
                ...obj,
                position: [mesh.position.x, mesh.position.y, mesh.position.z],
                rotation: [mesh.rotation.x, mesh.rotation.y, mesh.rotation.z],
                scale: [mesh.scale.x, mesh.scale.y, mesh.scale.z],
              };
            }
            return obj;
          })
        }));
      };

      const showToast = (message) => {
        setToastMsg(message);
        setTimeout(() => setToastMsg(''), 3500);
      };

      const addObject = (type) => {
        const newObj = {
          id: `obj_${Date.now()}`,
          name: `${type.charAt(0).toUpperCase() + type.slice(1)} ${sceneGraph.objects.length + 1}`,
          type: type,
          position: [0, 0, 0],
          rotation: [0, 0, 0],
          scale: [1, 1, 1],
          materialProps: { ...DEFAULT_MATERIAL }
        };
        setSceneGraph(prev => ({ ...prev, objects: [...prev.objects, newObj] }));
        setSelectedId(newObj.id);
        setShowAddMenu(false);
        showToast(`${newObj.name} adicionado`);
      };

      const deleteObject = (id) => {
        setSceneGraph(prev => ({
          ...prev,
          objects: prev.objects.filter(o => o.id !== id)
        }));
        if (selectedId === id) setSelectedId(null);
      };

      const updateSelectedObject = (updates) => {
        if (!selectedId) return;
        setSceneGraph(prev => ({
          ...prev,
          objects: prev.objects.map(obj => obj.id === selectedId ? { ...obj, ...updates } : obj)
        }));
      };

      const updateMaterial = (key, value) => {
        if (!selectedId) return;
        setSceneGraph(prev => ({
          ...prev,
          objects: prev.objects.map(obj => {
            if (obj.id === selectedId) {
              return {
                ...obj,
                materialProps: { ...obj.materialProps, [key]: value }
              };
            }
            return obj;
          })
        }));
      };

      // --- COPIAR HTML PARA ÁREA DE TRANSFERÊNCIA ---
      const copyHTMLToClipboard = () => {
        const sceneDataJson = JSON.stringify(sceneGraph);
        
        // CUIDADO AQUI: Usando \x2F para escapar perfeitamente o encerramento do script 
        // sem quebrar o HTML nativo que engloba tudo
        const htmlContent = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cena 3D Exportada</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #1e1e24; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #loader { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\x2Fscript>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\x2Fscript>
</head>
<body>
  <div id="loader">Carregando Cena...</div>
  <script>
    const sceneData = ${sceneDataJson};

    window.onload = function() {
      document.getElementById('loader').style.display = 'none';
      
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#1e1e24');
      
      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(5, 5, 5);
      
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);
      
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      
      sceneData.lights.forEach(l => {
        let light;
        if (l.type === 'ambient') light = new THREE.AmbientLight(l.color, l.intensity);
        if (l.type === 'directional') light = new THREE.DirectionalLight(l.color, l.intensity);
        if (l.position && light.position) light.position.set(...l.position);
        scene.add(light);
      });
      
      sceneData.objects.forEach(obj => {
        let geometry;
        switch (obj.type) {
          case 'cube': geometry = new THREE.BoxGeometry(1, 1, 1); break;
          case 'sphere': geometry = new THREE.SphereGeometry(0.6, 32, 16); break;
          case 'cylinder': geometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 32); break;
          case 'cone': geometry = new THREE.ConeGeometry(0.5, 1, 32); break;
          case 'plane': geometry = new THREE.PlaneGeometry(2, 2); break;
          default: geometry = new THREE.BoxGeometry(1, 1, 1);
        }
        
        const material = new THREE.MeshStandardMaterial({
          color: obj.materialProps.color,
          roughness: obj.materialProps.roughness,
          metalness: obj.materialProps.metalness,
          emissive: obj.materialProps.emissive,
          side: obj.type === 'plane' ? THREE.DoubleSide : THREE.FrontSide
        });
        
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(...obj.position);
        mesh.rotation.set(...obj.rotation);
        mesh.scale.set(...obj.scale);
        scene.add(mesh);
      });
      
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
      
      const animate = function () {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      };
      
      animate();
    };
  <\x2Fscript>
</body>
</html>`;

        const textArea = document.createElement("textarea");
        textArea.value = htmlContent;
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
          const successful = document.execCommand('copy');
          if (successful) {
            setIsCopied(true);
            showToast("Código HTML copiado para área de transferência!");
            setTimeout(() => setIsCopied(false), 3000);
          } else {
            showToast("Erro ao copiar código.");
          }
        } catch (err) {
          showToast("Não foi possível copiar.");
        }

        document.body.removeChild(textArea);
      };

      const selectedObjectData = sceneGraph.objects.find(o => o.id === selectedId);

      return (
        <div className="relative w-full h-screen bg-zinc-950 overflow-hidden font-sans select-none">
          
          {toastMsg && (
            <div className="absolute top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300">
              <div className="bg-zinc-800 border border-zinc-700 text-white px-4 py-2 rounded-full shadow-2xl text-sm font-medium whitespace-nowrap">
                {toastMsg}
              </div>
            </div>
          )}

          <div 
            ref={canvasContainerRef} 
            className="absolute inset-0 z-0"
            style={{ touchAction: 'none' }}
          />

          {!isLoaded && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-zinc-900">
              <div className="flex flex-col items-center">
                <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p className="text-white font-medium">Iniciando Engine 3D...</p>
              </div>
            </div>
          )}

          {isUIVisible && (
            <div className="absolute top-0 left-0 right-0 p-4 flex justify-between items-start z-10 pointer-events-none">
              <div className="pointer-events-auto flex gap-2">
                <button 
                  onClick={() => setShowSceneTree(!showSceneTree)}
                  className="p-3 bg-zinc-800/80 backdrop-blur text-white rounded-xl shadow-lg border border-zinc-700/50 active:scale-95 transition-transform"
                >
                  <Layers size={20} />
                </button>
              </div>
              <div className="pointer-events-auto flex gap-2">
                <button 
                  onClick={() => setIsUIVisible(false)}
                  className="p-3 bg-zinc-800/80 backdrop-blur text-white rounded-xl shadow-lg border border-zinc-700/50 active:scale-95 transition-transform"
                  title="Modo Visualização"
                >
                  <Eye size={20} />
                </button>
                <button 
                  onClick={copyHTMLToClipboard}
                  className={`p-3 backdrop-blur text-white rounded-xl shadow-lg border active:scale-95 transition-all font-medium flex gap-2 items-center ${
                    isCopied 
                    ? 'bg-green-600/90 border-green-500/50' 
                    : 'bg-blue-600/90 border-blue-500/50'
                  }`}
                >
                  {isCopied ? <Check size={20} /> : <Copy size={20} />}
                  <span className="hidden sm:inline">
                    {isCopied ? 'Copiado!' : 'Copiar HTML'}
                  </span>
                </button>
              </div>
            </div>
          )}

          {!isUIVisible && (
            <div className="absolute top-4 right-4 z-50">
              <button 
                onClick={() => setIsUIVisible(true)}
                className="p-3 bg-zinc-800/80 backdrop-blur text-white rounded-xl shadow-lg border border-zinc-700/50 active:scale-95 transition-transform flex items-center gap-2"
              >
                <Settings size={20} />
                <span>Editar</span>
              </button>
            </div>
          )}

          {isUIVisible && showSceneTree && (
            <div className="absolute top-20 left-4 w-64 max-h-[60vh] bg-zinc-900/95 backdrop-blur-md rounded-2xl shadow-2xl border border-zinc-700 z-20 flex flex-col overflow-hidden">
              <div className="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-800/50">
                <h3 className="text-white font-medium text-sm">Cena</h3>
                <button onClick={() => setShowSceneTree(false)} className="text-zinc-400 hover:text-white"><X size={16} /></button>
              </div>
              <div className="overflow-y-auto p-2 flex-1">
                {sceneGraph.objects.length === 0 && <p className="text-zinc-500 text-xs p-2 text-center">Nenhum objeto</p>}
                {sceneGraph.objects.map(obj => (
                  <div 
                    key={obj.id}
                    onClick={() => setSelectedId(obj.id)}
                    className={`flex items-center justify-between p-3 rounded-xl mb-1 cursor-pointer transition-colors ${selectedId === obj.id ? 'bg-blue-600 text-white' : 'text-zinc-300 hover:bg-zinc-800'}`}
                  >
                    <span className="text-sm truncate">{obj.name}</span>
                    {selectedId === obj.id && (
                      <button onClick={(e) => { e.stopPropagation(); deleteObject(obj.id); }} className="p-1 text-red-300 hover:text-white rounded">
                        <Trash2 size={14} />
                      </button>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {isUIVisible && showProperties && selectedObjectData && (
            <div className="absolute top-20 right-4 w-72 max-h-[70vh] bg-zinc-900/95 backdrop-blur-md rounded-2xl shadow-2xl border border-zinc-700 z-20 flex flex-col overflow-hidden">
              <div className="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-800/50">
                <h3 className="text-white font-medium text-sm truncate">{selectedObjectData.name}</h3>
                <button onClick={() => setShowProperties(false)} className="text-zinc-400 hover:text-white"><X size={16} /></button>
              </div>
              <div className="overflow-y-auto p-4 flex-1 space-y-6 custom-scrollbar">
                
                <div>
                  <h4 className="text-zinc-400 text-xs uppercase tracking-wider mb-3 font-semibold">Transformação</h4>
                  <div className="space-y-2">
                    {['Posição', 'Rotação', 'Escala'].map((label, idx) => {
                      const key = ['position', 'rotation', 'scale'][idx];
                      const vals = selectedObjectData[key];
                      return (
                        <div key={key} className="flex flex-col gap-1">
                          <span className="text-zinc-500 text-[10px] uppercase">{label}</span>
                          <div className="flex gap-1">
                            {['X', 'Y', 'Z'].map((axis, i) => (
                              <div key={axis} className="flex-1 bg-zinc-800 rounded flex items-center px-2 py-1 focus-within:ring-1 ring-blue-500">
                                <span className="text-zinc-500 text-xs mr-1">{axis}</span>
                                <input 
                                  type="number" 
                                  step={key === 'rotation' ? '0.1' : '0.1'}
                                  value={Number(vals[i]).toFixed(2)}
                                  onChange={(e) => {
                                    const newVals = [...vals];
                                    newVals[i] = parseFloat(e.target.value) || 0;
                                    updateSelectedObject({ [key]: newVals });
                                  }}
                                  className="w-full bg-transparent text-white text-xs outline-none"
                                />
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div>
                  <h4 className="text-zinc-400 text-xs uppercase tracking-wider mb-3 font-semibold">Material</h4>
                  <div className="space-y-4">
                    <div className="flex items-center justify-between bg-zinc-800/50 p-2 rounded-lg">
                      <span className="text-zinc-300 text-sm">Cor base</span>
                      <input 
                        type="color" 
                        value={selectedObjectData.materialProps.color}
                        onChange={(e) => updateMaterial('color', e.target.value)}
                        className="w-8 h-8 rounded cursor-pointer bg-transparent border-0"
                      />
                    </div>
                    
                    <div className="space-y-1">
                      <div className="flex justify-between text-zinc-300 text-xs">
                        <span>Rugosidade</span>
                        <span>{selectedObjectData.materialProps.roughness.toFixed(2)}</span>
                      </div>
                      <input 
                        type="range" min="0" max="1" step="0.01"
                        value={selectedObjectData.materialProps.roughness}
                        onChange={(e) => updateMaterial('roughness', parseFloat(e.target.value))}
                        className="w-full accent-blue-500 h-1 bg-zinc-700 rounded-lg appearance-none"
                      />
                    </div>

                    <div className="space-y-1">
                      <div className="flex justify-between text-zinc-300 text-xs">
                        <span>Metalicidade</span>
                        <span>{selectedObjectData.materialProps.metalness.toFixed(2)}</span>
                      </div>
                      <input 
                        type="range" min="0" max="1" step="0.01"
                        value={selectedObjectData.materialProps.metalness}
                        onChange={(e) => updateMaterial('metalness', parseFloat(e.target.value))}
                        className="w-full accent-blue-500 h-1 bg-zinc-700 rounded-lg appearance-none"
                      />
                    </div>

                    <div className="flex items-center justify-between bg-zinc-800/50 p-2 rounded-lg mt-2">
                      <span className="text-zinc-300 text-sm">Emissão (Glow)</span>
                      <input 
                        type="color" 
                        value={selectedObjectData.materialProps.emissive}
                        onChange={(e) => updateMaterial('emissive', e.target.value)}
                        className="w-8 h-8 rounded cursor-pointer bg-transparent border-0"
                      />
                    </div>
                  </div>
                </div>

              </div>
            </div>
          )}

          {isUIVisible && (
            <div className="absolute bottom-6 left-0 right-0 flex justify-center z-10 pointer-events-none px-4">
              <div className="pointer-events-auto bg-zinc-900/95 backdrop-blur-xl p-2 rounded-2xl shadow-2xl border border-zinc-700 flex gap-2 items-center">
                
                <button 
                  onClick={() => setShowAddMenu(!showAddMenu)}
                  className={`p-4 rounded-xl transition-colors ${showAddMenu ? 'bg-blue-600 text-white' : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'}`}
                >
                  <Plus size={24} />
                </button>

                <div className="w-px h-10 bg-zinc-700 mx-1"></div>

                <button 
                  onClick={() => setActiveTool('translate')}
                  className={`p-4 rounded-xl transition-colors ${activeTool === 'translate' ? 'bg-blue-600/20 text-blue-400' : 'text-zinc-400 hover:bg-zinc-800'}`}
                  title="Mover"
                >
                  <Move size={22} />
                </button>
                <button 
                  onClick={() => setActiveTool('rotate')}
                  className={`p-4 rounded-xl transition-colors ${activeTool === 'rotate' ? 'bg-blue-600/20 text-blue-400' : 'text-zinc-400 hover:bg-zinc-800'}`}
                  title="Rotacionar"
                >
                  <RotateCw size={22} />
                </button>
                <button 
                  onClick={() => setActiveTool('scale')}
                  className={`p-4 rounded-xl transition-colors ${activeTool === 'scale' ? 'bg-blue-600/20 text-blue-400' : 'text-zinc-400 hover:bg-zinc-800'}`}
                  title="Escalar"
                >
                  <Maximize size={22} />
                </button>
                
              </div>
            </div>
          )}

          {isUIVisible && showAddMenu && (
            <>
              <div className="absolute inset-0 bg-black/50 z-20" onClick={() => setShowAddMenu(false)}></div>
              <div className="absolute bottom-28 left-4 right-4 sm:left-1/2 sm:-translate-x-1/2 sm:w-80 bg-zinc-900 border border-zinc-700 rounded-3xl p-6 shadow-2xl z-30">
                <h3 className="text-white font-medium mb-4 text-center">Adicionar Primitiva</h3>
                <div className="grid grid-cols-3 gap-4">
                  {[
                    { type: 'cube', icon: Box, label: 'Cubo' },
                    { type: 'sphere', icon: Circle, label: 'Esfera' },
                    { type: 'cylinder', icon: Cylinder, label: 'Cilindro' },
                    { type: 'cone', icon: Layers, label: 'Cone' },
                    { type: 'plane', icon: ImageIcon, label: 'Plano' },
                  ].map(item => (
                    <button 
                      key={item.type}
                      onClick={() => addObject(item.type)}
                      className="flex flex-col items-center gap-2 p-3 bg-zinc-800 rounded-2xl hover:bg-zinc-700 active:scale-95 transition-all"
                    >
                      <item.icon size={28} className="text-blue-400" strokeWidth={1.5} />
                      <span className="text-zinc-300 text-xs">{item.label}</span>
                    </button>
                  ))}
                </div>
              </div>
            </>
          )}

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
